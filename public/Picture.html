<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camagru</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <a href="http://localhost:3001/homepage">
        <h2>Camagru</h2>
      </a>
    </header>
    <main>
      <div id="picture-detail-container">
        <img id="picture-detail" src="{{pictureUrl}}" alt="Picture Detail" />
		<div id="like">
		  <h3>Like {{likesHtml}}
		  <input type="checkbox" id="like-checkbox" {{checked}} /></h3>
		</div>
        <div id="comments-container">
          <h3>Comments</h3>
          <div id="comments-list">
            <input
              type="text"
              id="new_comment"
              name="new_comment"
              placeholder="New comment"
              required
            />
			<button type="submit" id="add-comment">Add</button>
            {{commentsHtml}}
          </div>
        </div>
	</div>
	{{deleteButton}}
    </main>
	<script></script>
    <script src="js/deletePic.js"></script>
    <script src="js/like.js"></script>
    <script src="js/comments.js"></script>
	<form id="logout-form" class="logout-form">
		<button type="submit" id="logout-button">SIGN OUT</button>
	</form>
</body>
<footer>
	<p>&copy; 2024 Shanley LEON. All rights reserved.</p>
  </footer>
</html>

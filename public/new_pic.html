<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camagru</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <a href="http://localhost:3001/homepage">
        <h2>Camagru</h2>
      </a>
    </header>
    <main>
      <h1>Photo Shoot</h1>
	  <div id="newPic-container">
		<div id="camera">
			<video id="video" width="640" height="480" autoplay></video>
			<canvas id="canvas-background" width="640" height="480"></canvas> <!-- Pour la vidéo -->
			<canvas id="canvas-stickers" width="640" height="480"></canvas> <!-- Pour les stickers -->
		</div>
			<div id="stickers">
				<h7>Stickers</h7>
				<img src="stickers/sticker1.png" alt="Sticker 1" draggable="true">
				<img src="stickers/sticker2.png" alt="Sticker 2" draggable="true">
				<img src="stickers/sticker3.png" alt="Sticker 3" draggable="true">
				<img src="stickers/sticker4.png" alt="Sticker 4" draggable="true">
				<img src="stickers/sticker3.png" alt="Sticker 5" draggable="true">
			</div>
		</div>
		<button id="capture-button">Save picture</button>
	
		<script src="js/webcam.js"></script>
	</body>
</main>
</html>

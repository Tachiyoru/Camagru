<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camagru</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
	<style>
	</style>
  <body>
    <header>
      <a href="http://localhost:3001/homepage">
        <h2>Camagru</h2>
	</a>
	<h0>Photo Shoot</h0>
	</header>
	<main>
		<div id="newPic-container">
			<div id="camera" >
				<video id="video" autoplay></video>
				<canvas id="canvas-background"></canvas>
				<canvas id="canvas-stickers"></canvas>
			</div>
			<div id="stickers">
				<h7>Stickers</h7>
				<img src="stickers/sticker1.png" alt="Sticker 1" draggable="true">
				<img src="stickers/sticker2.png" alt="Sticker 2" draggable="true">
				<img src="stickers/sticker3.png" alt="Sticker 3" draggable="true">
				<img src="stickers/sticker4.png" alt="Sticker 4" draggable="true">
				<img src="stickers/sticker5.png" alt="Sticker 5" draggable="true">
				<img src="stickers/panda.gif" alt="Sticker 6" draggable="true">
			</div>
		</div>
		<button id="capture-button">Save picture</button>
		<input type="file" id="upload-image" accept="image/*" style="display: none;" />
		<button id="upload-button">Upload a pic</button>
		<form id="previous-form" class="previous-form">
			<button type="submit" id="previous-button">All my pictures</button>
		</form>
		<div id="modal-oldpic" class="modal2">
			<div class="modal-oldpic-content">
				<span class="close-button">&times;</span>
				<h3>Your pictures</h3>
				<div id="old-pics"></div>
			</div>
		</div>
		<div id="loading-screen">
			<div class="loading-content">
				<div class="loading-text">Loading...</div>
				<svg
				id="svg-spinner"
				xmlns="http://www.w3.org/2000/svg"
				viewBox="0 0 48 48"
				>
				<circle cx="24" cy="4" r="4" fill="#fff" />
				<circle cx="12.19" cy="7.86" r="3.7" fill="#fffbf2" />
				<circle cx="5.02" cy="17.68" r="3.4" fill="#fef7e4" />
				<circle cx="5.02" cy="30.32" r="3.1" fill="#fef3d7" />
				<circle cx="12.19" cy="40.14" r="2.8" fill="#feefc9" />
				<circle cx="24" cy="44" r="2.5" fill="#feebbc" />
				<circle cx="35.81" cy="40.14" r="2.2" fill="#fde7af" />
				<circle cx="42.98" cy="30.32" r="1.9" fill="#fde3a1" />
				<circle cx="42.98" cy="17.68" r="1.6" fill="#fddf94" />
				<circle cx="35.81" cy="7.86" r="1.3" fill="#fcdb86" />
				</svg>
			</div>
			</div>
	</main>
</body>
<form id="logout-form" class="logout-form">
	<button type="submit" id="logout-button">SIGN OUT</button>
</form>
<script src="js/oldpic.js"></script>
<script src="js/webcam.js"></script>
<script src="js/logout.js"></script>
<footer>
	<p>&copy; 2024 Shanley LEON. All rights reserved.</p>
  </footer>
</html>
